apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-x-deployment
spec:
  selector:
    matchLabels:
      app: engine-x
  replicas: 2
  template:
    metadata:
      labels:
        app: engine-x
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
